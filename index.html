<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/style.css">
    <title>form practice</title>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap"
        rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
</head>

<body>
    <!-- ページタイトル -->
    <div class="page-title">
        <h1>登録用フォーム</h1>
        <p>すべての項目を入力してください</p>
    </div>
    <!--フォームカード-->
    <div class="form-card">
        <div class="form-main-title">アカウント作成</div>

        <form action="#" method="post" novalidate>

            <!--==個人情報==-->
            <section class="form-section">
                <h2>個人情報</h2>

                <div class="field-row is_flex">
                    <div class="field">
                        <label for="last_name">名字<span class="required">*必須</span></label>
                        <input type="text" id="last_name" name="last_name" placeholder="例：山田">
                    </div>
                    <div class="field">
                        <label for="first_name">名前<span class="required">*必須</span></label>
                        <input type="text" id="first_name" name="first_name" placeholder="例：花子">
                    </div>
                </div>

                <!--==生年月日==-->
                <div class="field">
                    <label>生年月日<span class="required">*必須</span></label>
                    <div class="birthdate-row is_flex">
                        <select name="birth_year" aria-label="年">
                            <option value="">年</option>
                        </select>
                        <select name="birth_month" aria-label="月">
                            <option value="">月</option>
                            <option value="1">1月</option>
                            <option value="2">2月</option>
                            <option value="3">3月</option>
                            <option value="4">4月</option>
                            <option value="5">5月</option>
                            <option value="6">6月</option>
                            <option value="7">7月</option>
                            <option value="8">8月</option>
                            <option value="9">9月</option>
                            <option value="10">10月</option>
                            <option value="11">11月</option>
                            <option value="12">12月</option>
                        </select>
                        <select name="birth_day" aria-label="日">
                            <option value="">日</option>
                        </select>
                    </div>
                </div>
                <!--性別-->
                <div class="field">
                    <label class="field-label">性別<span class="required">*必須</span></label>
                    <div class="radio-group" role="radiogroup" aria-label="性別">
                        <label>
                            <input type="radio" name="gender" value="male">
                            <span>男性</span>
                        </label>
                        <label>
                            <input type="radio" name="gender" value="female">
                            <span>女性</span>
                        </label>
                        <label>
                            <input type="radio" name="gender" value="other">
                            <span>その他</span>
                        </label>
                    </div>
                </div>
                <!-- 職業 -->
                <div class="field">
                    <label for="job">職業<span class="required">*必須</span></label>
                    <input type="text" id="job" name="job" placeholder="例：会社員、学生 など">
                </div>
            </section>
            <section class="form-section">
                <h2>アカウント情報</h2>

                <div class="field">
                    <label for="username">アカウント名<span class="required">*必須</span></label>
                    <input type="text" id="username" name="username" placeholder="例：hana_chan">
                </div>

                <div class="field">
                    <label for="email">メールアドレス<span class="required">*必須</span></label>
                    <input type="email" id="email" name="email" placeholder="例：hana@example.com">
                </div>

                <div class="field">
                    <label for="password">パスワード<span class="required">*必須</span></label>
                    <input type="password" id="password" name="password" placeholder="8文字以上">
                </div>

                <div class="field">
                    <label for="password_confirm">確認用パスワード<span class="required">*必須</span></label>
                    <input type="password" id="password_confirm" name="password_confirm" placeholder="もう一度入力してください">
                </div>
            </section>

            <!-- ===== 連絡先 ===== -->
            <section class="form-section">
                <h2>連絡先</h2>

                <div class="field">
                    <label for="address">住所</label>
                    <input type="text" id="address" name="address" placeholder="例：東京都渋谷区〇〇1-2-3">
                </div>

                <div class="field">
                    <label for="tel">電話番号</label>
                    <input type="tel" id="tel" name="tel" placeholder="例：090-1234-5678">
                </div>
            </section>
            <!-- ===== 購読情報 ===== -->
            <section class="form-section">
                <h2>購読情報</h2>
                <div class="field">
                    <label class="field-label">受け取る情報を選んでね<span class="required">*必須</span></label>
                    <div class="check-group" role="radiogroup" aria-label="購読情報">
                        <label>
                            <input type="checkbox" name="subscription" value="magazine">
                            <span>メールマガジン</span>
                        </label>
                        <label>
                            <input type="checkbox" name="subscription" value="coupon">
                            <span>クーポン</span>
                        </label>
                    </div>
                </div>
            </section>
            <!-- 送信ボタン -->
            <div class="submit-wrap">
                <button type="submit" class="btn-submit">登録する</button>
            </div>
        </form>

        <p class="form-footer">ご入力いただいた個人情報は適切に管理いたします</p>
    </div>

    <script>
        /* 年のオプションを動的生成 */
        const yearSel = document.querySelector('select[name="birth_year"]');
        const currentYear = new Date().getFullYear();
        for (let y = currentYear - 20; y >= currentYear - 60; y--) {
            const opt = document.createElement('option');
            opt.value = y;
            opt.textContent = y + '年';
            yearSel.appendChild(opt);
        }

        /* 日のオプションを動的生成 */
        const daySel = document.querySelector('select[name="birth_day"]');
        for (let d = 1; d <= 31; d++) {
            const opt = document.createElement('option');
            opt.value = d;
            opt.textContent = d + '日';
            daySel.appendChild(opt);
        }
    </script>
</body>

</html>
